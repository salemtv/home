<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Online">
<!-- Evitar traducción de iconos Material Symbols -->
<meta name="google" content="notranslate">
    <link rel="manifest" href="manifest.json">
    <!-- ============================================ -->
    <!-- [NUEVO] FAVICON Y APPLE TOUCH ICON - PNG reales -->
    <!-- ============================================ -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="preload" href="MaterialSymbolsRounded.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <title>STV - Cine</title>
</head>
<body data-page="cinema">
    <div id="app-wrapper">
        <div id="supported-content" style="display: none;">

            <header class="top-bar">
                <div class="top-bar-inner">
                    <div class="brand">
                        <img src="stv.png" alt="STV" class="logo-img">
                    </div>
                    <nav class="top-tabs">
                        <a href="index.html" class="top-tab">
                            <span class="material-symbols-rounded tab-icon">home</span>
                            <span class="tab-label mini">Inicio</span>
                            <span class="badge" id="home-badge" style="display:none;">0</span>
                        </a>
                        <a href="tv.html" class="top-tab">
                            <span class="material-symbols-rounded tab-icon">live_tv</span>
                            <span class="tab-label mini">TV</span>
                        </a>
                        <a href="cinema.html" class="top-tab active">
                            <span class="material-symbols-rounded tab-icon">theaters</span>
                            <span class="tab-label mini">Cine</span>
                        </a>
                    </nav>
                </div>
            </header>

            <!-- ============================================ -->
            <!-- [NUEVO] CAPA DE PRECARGA / PAGE LOADER -->
            <!-- Se muestra mientras carga el JSON de peliculas -->
            <!-- Se oculta con MutationObserver cuando renderList() inserta .list-item -->
            <!-- ============================================ -->
            <div class="page-loader" id="page-loader">
                <div class="loader-content">
                    <img src="icon-192x192.png" alt="STV" class="loader-logo">
                    <div class="loader-spinner"></div>
                </div>
            </div>

            <main class="main-content" id="main-content">
                <section class="tab-panel" id="tab-cinema">

                    <div class="video-section">
                        <div class="video-container" id="video-container">
                            <span class="material-symbols-rounded placeholder-icon">theaters</span>
                            <p class="placeholder-text">Selecciona una película para reproducir</p>
                        </div>
                        <button class="reload-btn" id="reload-btn" type="button">
                            <span class="material-symbols-rounded">refresh</span>
                        </button>
                    </div>

                    <div class="sub-tabs">
                        <button class="sub-tab active" data-tab="all">Películas</button>
                        <button class="sub-tab" data-tab="favorites">Favoritos</button>
                    </div>

                    <div class="search-bar">
                        <span class="material-symbols-rounded search-icon">search</span>
                        <input type="text" id="search-input" placeholder="Buscar películas..." autocomplete="off">
                        <button class="clear-btn" id="search-clear" type="button">
                            <span class="material-symbols-rounded">close</span>
                        </button>
                    </div>

                    <div id="list-container" data-tab="all"></div>

                </section>
            </main>

        </div>
        <div id="unsupported-content" style="display: none;">
            <div class="unsupported-wrapper">
                <span class="material-symbols-rounded unsupported-icon">block</span>
                <h2 class="title">No Disponible</h2>
                <p class="subtitle">Esta aplicación solo está disponible para dispositivos móviles, tabletas, Android TV y macOS.</p>
                <p class="global">Windows y Linux no son compatibles.</p>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
